services:
  attic:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your public https hostname}
      MAX_PROFILES: ${MAX_PROFILES:-1000}
      ENABLE_PUBLISHING: ${ENABLE_PUBLISHING:-true}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
    volumes:
      - attic-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100

volumes:
  attic-data:
